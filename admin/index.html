<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwMZ4xTjW_kiSC8mlxXZyyHYGsfcAoTF0VbMPYVBtZXeim-IdUjDqxsYijr1I2NZQBu/exec';
var SITE = 'https://m-ashraful.github.io/';
var DEMO = /[?&]demo\b/.test(location.search);
var AUTH = ''; try { AUTH = localStorage.getItem('pfa_auth') || ''; } catch (e) {}
function setAuth(t) { AUTH = t || ''; try { t ? localStorage.setItem('pfa_auth', t) : localStorage.removeItem('pfa_auth'); } catch (e) {} }
(function () {
  var t = ''; try { t = localStorage.getItem('pfa_theme') || ''; } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();

/* text/plain POST — preflight ছাড়াই সরাসরি Apps Script-এ */
function callServer(fn, args) {
  if (DEMO) return demoCall(fn, args || []);
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], auth: AUTH })
  }).then(function (r) {
    if (!r.ok) throw new Error('সার্ভার সাড়া দিচ্ছে না (' + r.status + ') — একটু পরে আবার চেষ্টা করুন।');
    return r.json().catch(function () { throw new Error('সার্ভারের উত্তর বোঝা যায়নি — সার্ভারের অনুমতি দেওয়া হয়েছে কিনা দেখুন।'); });
  }, function () {
    throw new Error('সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট সংযোগ দেখুন।');
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'অজানা সমস্যা।');
    return j.data;
  });
}

/* ?demo — সার্ভার ছাড়া পরীক্ষার জন্য: সাইটের নিজের content.json/template.html, প্রকাশ শুধু ভান */
var DEMO_STATE = { pin: '', users: ['helper@demo.app'], token: true, pubs: [] };
function demoCall(fn, a) {
  var wait = function (v) { return new Promise(function (r) { setTimeout(function () { r(v); }, 150); }); };
  if (fn === 'appLockMode') return wait(DEMO_STATE.pin ? 'unlock' : 'setup');
  if (fn === 'appLockSetup') { DEMO_STATE.pin = a[0]; return wait(true); }
  if (fn === 'appLockUnlock') return a[0] === DEMO_STATE.pin ? wait(true) : Promise.reject(new Error('ভুল PIN।'));
  if (fn === 'appLockChange') { DEMO_STATE.pin = a[1]; return wait(true); }
  if (fn === 'apiSendCode') return wait(true);
  if (fn === 'apiVerifyCode') return wait('demo-token-' + Date.now() + '-xxxxxxxxxxxxxxxxxxxxxxxx');
  if (fn === 'apiLogout') return wait(true);
  if (fn === 'apiLoad') return Promise.all([fetch('../content.json').then(function (r) { return r.json(); }), fetch('../template.html').then(function (r) { return r.text(); })])
    .then(function (x) { return { content: x[0], template: x[1], base: { content: 'c1', template: 't1' }, owner: true, me: 'owner@demo.app' }; });
  if (fn === 'apiPublish') { window.__lastPublish = a[0]; DEMO_STATE.pubs.unshift({ sha: 'd' + Date.now().toString(16), msg: a[0].note || 'content update', at: Date.now(), by: 'owner@demo.app', content: a[0].content }); return wait({ commit: 'abc1234', base: { content: 'c' + Date.now(), template: 't1' }, at: Date.now() }); }
  if (fn === 'apiHistory') return wait(DEMO_STATE.pubs.concat([{ sha: 'aaaaaaa', msg: 'New work: Salary System, Work Hub, Banglish Tool', at: Date.now() - 86400000, by: 'কম্পিউটার থেকে (Claude Code)' }]));
  if (fn === 'apiVersion') { var v = DEMO_STATE.pubs.filter(function (p) { return p.sha === a[0]; })[0]; return v ? wait(JSON.parse(JSON.stringify(v.content))) : fetch('../content.json').then(function (r) { return r.json(); }); }
  if (fn === 'apiGhState') return wait({ set: DEMO_STATE.token, user: 'm-ashraful', at: Date.now() - 3600000, tail: 'a1b2' });
  if (fn === 'apiSetToken') { DEMO_STATE.token = true; return wait({ set: true, user: 'm-ashraful', at: Date.now(), tail: String(a[0]).slice(-4) }); }
  if (fn === 'apiClearToken') { DEMO_STATE.token = false; return wait({ set: false }); }
  var sec = function () { return { owner: 'owner@demo.app', users: DEMO_STATE.users.slice(), limit: 10, sessions: [{ id: 'cur-xxxxxxxxxxxxxxxxxxxxxxxx', email: 'owner@demo.app', device: 'Windows · Chrome', created: Date.now() - 864e5, last: Date.now(), current: true }, { id: 'oth-xxxxxxxxxxxxxxxxxxxxxxxx', email: 'helper@demo.app', device: 'Android · Chrome', created: Date.now() - 3 * 864e5, last: Date.now() - 7200000 }] }; };
  if (fn === 'apiSecurity') return wait(sec());
  if (fn === 'apiAddUser') { DEMO_STATE.users.push(a[0]); return wait(sec()); }
  if (fn === 'apiRemoveUser') { DEMO_STATE.users = DEMO_STATE.users.filter(function (u) { return u !== a[0]; }); return wait(sec()); }
  if (fn === 'apiRevokeSession' || fn === 'apiRevokeOthers') return wait(sec());
  return Promise.reject(new Error('demo: ' + fn));
}

<style>
:root {
  --bg: #f3f4fb; --bg2: #ebedf8; --card: #fff; --ink: #141834; --ink2: #4a5072; --ink3: #878cab;
  --line: #e4e6f2; --soft: #f6f7fd; --acc: #6d28d9; --acc2: #4f46e5; --pos: #14915a; --neg: #d6334a; --warn: #b45309;
  --grad: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #c026d3);
  --shadow: 0 1px 2px rgba(20,24,60,.05), 0 8px 24px rgba(20,24,60,.06);
  --m1: #4f46e5; --m2: #7c3aed; --m3: #c026d3;
}
[data-theme=dark] {
  --bg: #0d0f20; --bg2: #12152b; --card: #171a34; --ink: #eef0ff; --ink2: #b5b9dc; --ink3: #7d82a8;
  --line: #272b4d; --soft: #1d2140; --acc: #a78bfa; --acc2: #818cf8; --pos: #3ccf8e; --neg: #ff6b81; --warn: #fbbf24;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  --m1: #818cf8; --m2: #a78bfa; --m3: #e879f9;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', system-ui, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; min-height: 100vh; }
:lang(bn), .bn { font-family: 'Hind Siliguri', 'Plus Jakarta Sans', system-ui, sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.mk { width: 40px; height: 40px; }

/* ---------- login ---------- */
#login { min-height: 100vh; display: grid; place-items: center; padding: 20px;
  background: radial-gradient(800px 500px at 0% 0%, rgba(99,102,241,.25), transparent 60%), radial-gradient(700px 500px at 100% 100%, rgba(192,38,211,.18), transparent 60%), var(--bg); }
.lg-card { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 30px 26px; box-shadow: var(--shadow); text-align: center; }
.lg-card .mk { width: 56px; height: 56px; }
.lg-card h1 { margin: 10px 0 2px; font-size: 22px; }
.lg-card .sub { color: var(--ink3); font-size: 14px; margin-bottom: 20px; }
.lg-card label { display: block; text-align: left; font-size: 13px; font-weight: 700; color: var(--ink2); margin: 0 0 6px; }
.lg-card input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--soft); outline: none; font-size: 16px; }
.lg-card input:focus { border-color: var(--acc); }
.lg-card input.code { letter-spacing: 8px; text-align: center; font-size: 22px; font-weight: 800; }
.lg-btn { width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px; color: #fff; font-weight: 800; background: var(--grad); box-shadow: 0 8px 20px rgba(124,58,237,.3); }
.lg-btn:disabled { opacity: .6; cursor: wait; }
.lg-msg { min-height: 20px; margin-top: 10px; font-size: 13.5px; font-weight: 600; color: var(--neg); }
.lg-msg.ok { color: var(--pos); }
.lg-link { background: none; border: 0; color: var(--acc); font-weight: 700; font-size: 13px; margin-top: 4px; }
.lg-foot { margin-top: 18px; font-size: 12px; color: var(--ink3); }

/* ---------- app shell ---------- */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .mk { width: 34px; height: 34px; flex: none; }
.brand b { display: block; font-size: 16px; line-height: 1.1; }
.brand small { display: block; color: var(--ink3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: var(--soft); color: var(--ink2); border: 1px solid var(--line); white-space: nowrap; }
.pill.dirty { background: #fff7e6; color: #92400e; border-color: #fcd9a0; }
[data-theme=dark] .pill.dirty { background: #3a2a0a; color: #fbbf24; border-color: #6b4b12; }
.pill.ok { background: #e8f8ef; color: #0f7a4a; border-color: #b9e8cf; }
[data-theme=dark] .pill.ok { background: #0f2e22; color: #3ccf8e; border-color: #1c5a40; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--acc); }
.btn.pri { border: 0; color: #fff; background: var(--grad); box-shadow: 0 6px 16px rgba(124,58,237,.28); }
.btn.pri:disabled { opacity: .5; box-shadow: none; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.btn.danger { color: var(--neg); }
.ib { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }

.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 59px); }
.side { border-right: 1px solid var(--line); background: var(--card); padding: 14px 10px; position: sticky; top: 59px; height: calc(100vh - 59px); overflow: auto; display: flex; flex-direction: column; }
.side a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 11px; color: var(--ink2); text-decoration: none; font-weight: 600; font-size: 14.5px; }
.side a:hover { background: var(--soft); }
.side a.on { background: color-mix(in srgb, var(--acc) 12%, transparent); color: var(--acc); }
.side a i { font-style: normal; width: 22px; text-align: center; }
.side .sep { height: 1px; background: var(--line); margin: 10px 6px; }
.side .dev { margin-top: auto; padding: 14px 10px 4px; font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.dev-mk { width: 1.4em; height: 1.4em; flex: none; }
.chipnav { display: none; }

.work { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.work.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.ed { padding: 22px clamp(14px, 3vw, 34px) 120px; min-width: 0; }
.ed h2 { margin: 0 0 4px; font-size: 22px; }
.ed .hint { color: var(--ink3); font-size: 13.5px; margin: 0 0 18px; line-height: 1.6; }
.ed .hint code { background: var(--soft); border: 1px solid var(--line); padding: 0 5px; border-radius: 6px; font-size: 12.5px; }

/* fields */
.f { margin: 0 0 16px; }
.f > label, .f > .lb { display: block; font-weight: 700; font-size: 13.5px; color: var(--ink2); margin: 0 0 6px; }
.bi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lng { position: relative; }
.lng small { position: absolute; top: -8px; left: 10px; padding: 0 5px; background: var(--card); color: var(--ink3); font-size: 10.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; }
.box .lng small { background: var(--card); }
input.t, textarea.t, select.t { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--card); outline: none; font-size: 14.5px; line-height: 1.5; }
textarea.t { resize: vertical; min-height: 46px; }
input.t:focus, textarea.t:focus, select.t:focus { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 15%, transparent); }
.sw { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink2); user-select: none; }
.sw input { display: none; }
.sw span { width: 40px; height: 23px; border-radius: 99px; background: var(--line); position: relative; transition: .2s; flex: none; }
.sw span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.sw input:checked + span { background: var(--acc); }
.sw input:checked + span::after { left: 20px; }

.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 4px; box-shadow: var(--shadow); margin: 0 0 18px; }
.box > h3 { margin: -4px 0 14px; font-size: 15.5px; }
.lst { display: flex; flex-direction: column; gap: 8px; margin: 0 0 10px; }
.it { border: 1px solid var(--line); border-radius: 13px; background: var(--soft); }
.it.hid { opacity: .6; }
.it-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; cursor: pointer; min-height: 44px; }
.it-h .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it-h .nm em { font-style: normal; font-weight: 600; color: var(--ink3); margin-left: 6px; font-size: 12.5px; }
.it-h .ar { color: var(--ink3); transition: .2s; font-size: 12px; }
.it.open > .it-h .ar { transform: rotate(90deg); }
.it-h .tools { display: flex; gap: 2px; flex: none; }
.it-h .x { width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--ink3); display: grid; place-items: center; font-size: 13px; }
.it-h .x:hover { border-color: var(--line); background: var(--card); color: var(--ink); }
.it-h .x.del:hover { color: var(--neg); }
.it-b { padding: 14px 12px 2px; border-top: 1px solid var(--line); background: var(--card); border-radius: 0 0 13px 13px; }
.it-b .it { background: var(--soft); }
.it-b .lst { margin-bottom: 6px; }
.it.flat { display: flex; align-items: flex-start; gap: 6px; padding: 10px 6px 0 10px; background: var(--card); }
.it.flat > .grow { flex: 1; min-width: 0; }
.it.flat > .tools { display: flex; padding-top: 4px; }
.add { width: 100%; padding: 10px; border: 1.5px dashed var(--line); border-radius: 12px; background: none; color: var(--acc); font-weight: 700; margin-bottom: 14px; }
.add:hover { border-color: var(--acc); }

.iconbtn { display: inline-flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); font-weight: 600; font-size: 13.5px; color: var(--ink2); }
.iconbtn .sv, .igrid button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: #fff; background: var(--grad); }
.iconbtn svg, .igrid svg { width: 18px; height: 18px; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, 44px); gap: 8px; margin-top: 10px; }
.igrid button { width: 44px; height: 44px; border: 3px solid transparent; }
.igrid button.on { border-color: var(--ink); }

.img { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.img .th { width: 96px; height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft) center/cover no-repeat; flex: none; display: grid; place-items: center; color: var(--ink3); font-size: 12px; }
.img .th.sq { width: 64px; }
.img .th.tall { width: 44px; height: 88px; }
.img .meta { font-size: 12px; color: var(--ink3); word-break: break-all; flex: 1; min-width: 120px; }
.img .meta b { color: var(--warn); }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--soft); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--acc); box-shadow: var(--shadow); }

/* preview */
.pv { position: sticky; top: 59px; height: calc(100vh - 59px); border-left: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; min-width: 0; }
.pv-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
.pv-h b { margin-right: auto; font-size: 14px; }
.pv-box { flex: 1; position: relative; overflow: hidden; }
.pv-box iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; transform-origin: 0 0; }
.pv-box.phone iframe { left: 50%; border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.25); top: 16px; }
.pv.full { position: fixed; inset: 0; z-index: 60; height: auto; }

/* lists for history/security */
.row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .g { flex: 1; min-width: 0; }
.row .g b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.row .g small { color: var(--ink3); font-size: 12.5px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 800; background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
.steps { margin: 0 0 14px; padding-left: 20px; line-height: 1.8; color: var(--ink2); }
.steps b { color: var(--ink); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); color: var(--ink2); font-size: 13.5px; line-height: 1.6; margin: 0 0 16px; }
.note.warn { background: #fff7e6; border-color: #fcd9a0; color: #7c4a03; }
[data-theme=dark] .note.warn { background: #33250a; border-color: #6b4b12; color: #fbd38d; }

/* modal + toast */
.mod { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(10,12,30,.5); backdrop-filter: blur(4px); }
.mod-c { width: min(460px, 100%); background: var(--card); border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.mod-c h3 { margin: 0 0 8px; }
.mod-c p { margin: 0 0 14px; color: var(--ink2); line-height: 1.6; font-size: 14px; }
.mod-c .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; z-index: 90; padding: 11px 18px; border-radius: 12px; background: #141834; color: #fff; font-weight: 700; font-size: 14px; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.toast.err { background: #b4233a; }
.busy { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: rgba(10,12,30,.35); }
.busy div { background: var(--card); padding: 18px 24px; border-radius: 14px; font-weight: 700; box-shadow: var(--shadow); }
.loading { padding: 60px 20px; text-align: center; color: var(--ink3); }

@media (max-width: 1279px) {
  .work.split { grid-template-columns: minmax(0, 1fr); }
  .work.split .pv { display: none; }
  .work.split .pv.full { display: flex; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .chipnav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 59px; z-index: 20; scrollbar-width: none; }
  .chipnav::-webkit-scrollbar { display: none; }
  .chipnav a { flex: none; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); text-decoration: none; color: var(--ink2); font-weight: 700; font-size: 13px; }

    wait:   { sub: '⏳ একটু অপেক্ষা করুন...', a: 'Please Enter the Pin', btn: 'Enter', busy: '', sw: '' },
    unlock: { sub: '', a: 'Please Enter the Pin', btn: 'Enter', busy: 'Logging IN...', sw: '🔑 PIN change?' },
    setup:  { sub: 'নতুন PIN ঠিক করুন — এরপর থেকে খুলতে এই PIN লাগবে। অন্তত ' + bn(MINLEN) + ' অক্ষর।', a: 'New PIN', b: 'Confirm PIN', btn: 'Set PIN', busy: '⏳ সেভ হচ্ছে...', sw: '' },
    change: { sub: 'আগে বর্তমান PIN দিন, তারপর নতুন PIN।', a: 'Current PIN', b: 'New PIN', c: 'Confirm new PIN', btn: 'Change PIN', busy: '⏳ যাচাই হচ্ছে...', sw: '← ফিরে যান' }

var KINDS = {
  desk:  { w: 1600, q: .8,  t: 'কম্পিউটারের স্ক্রিনশট (চওড়া)', th: '' },

  tile:  { w: 240,  q: .9,  sq: 1, t: 'বড় আইকন (বর্গাকার)', th: 'sq' },
  photo: { w: 500,  q: .88, sq: 1, t: 'ছবি (বর্গাকার করে কাটা হবে)', th: 'sq' }
};
function srcOf(p) { return S.pending[p] || (p ? '../' + p : ''); }
function imagePicker(obj, key, kind, after) {
  var K = KINDS[kind], w = el('div', 'img');
  var cur = obj[key];
  var th = el('div', 'th ' + K.th, cur ? '' : 'নেই'); if (cur) th.style.backgroundImage = 'url("' + srcOf(cur) + '")';
  var meta = el('div', 'meta', esc(K.t) + (cur ? '<br>' + esc(cur) + (S.pending[cur] ? ' · <b>নতুন — প্রকাশ বাকি</b>' : '') : ''));
  var f = el('input'); f.type = 'file'; f.accept = 'image/*'; f.hidden = true;
  var b = el('button', 'btn sm', cur ? '🖼️ ছবি বদলান' : '🖼️ ছবি দিন'); b.type = 'button'; b.onclick = function () { f.click(); };
  f.onchange = function () {
    var file = f.files && f.files[0]; if (!file) return;
    busy('ছবি তৈরি হচ্ছে…');
    shrink(file, K).then(function (r) {
      busy();
      var p = 'assets/u/' + kind + '-' + Date.now().toString(36) + '.webp';
      S.pending[p] = r.url; obj[key] = p;
      if (after) after(r);
      changed(); renderPanel(); toast('✅ ছবি বসেছে — প্রকাশ করলে সাইটে যাবে');
    }, function (e) { busy(); toast(e.message, true); });
  };
  w.appendChild(th); w.appendChild(meta); w.appendChild(b); w.appendChild(f);
  return w;
}
function shrink(file, K) {
  return new Promise(function (res, rej) {
    if (!/^image\//.test(file.type)) return rej(new Error('এটা ছবি নয়।'));
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
      if (K.sq) { var m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
      var s = Math.min(1, K.w / sw), c = document.createElement('canvas');
      c.width = Math.round(sw * s); c.height = Math.round(sh * s);
      var g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      var url = c.toDataURL('image/webp', K.q);
      if (url.indexOf('data:image/webp') !== 0) return rej(new Error('এই ব্রাউজারে ছবি তৈরি হচ্ছে না — Chrome দিয়ে চেষ্টা করুন।'));
      if (url.length > 3800000) return rej(new Error('ছবিটা অনেক বড় — ছোট একটা ছবি দিন।'));
      res({ url: url, w: c.width, h: c.height });
    };
    im.onerror = function () { URL.revokeObjectURL(u); rej(new Error('ছবিটা খোলা যায়নি।')); };
    im.src = u;
  });
}

  callServer('apiGhState', []).then(function (st) {
    box.innerHTML = '';
    if (st.set) box.appendChild(el('div', 'note', '✅ চাবি বসানো আছে' + (st.user ? ' (GitHub: <b>' + esc(st.user) + '</b>, শেষ ৪ অক্ষর …' + esc(st.tail || '') + ')' : '') + ' · ' + when(st.at)));
    else box.appendChild(el('div', 'note warn', '⚠️ এখনো চাবি বসানো হয়নি — নিচের ধাপগুলো একবার করলেই হবে।'));
    if (!S.owner && !DEMO) { box.appendChild(el('p', 'hint', 'চাবি শুধু মালিক বসাতে পারেন।')); return; }
    box.appendChild(el('ol', 'steps',
      '<li>কম্পিউটারে GitHub-এ <b>m-ashraful</b> অ্যাকাউন্টে লগইন থাকা অবস্থায় <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">এই লিংক</a> খুলুন।</li>' +
      '<li><b>Token name</b>: Portfolio Admin · <b>Expiration</b>: 1 year (বা No expiration)।</li>' +
      '<li><b>Repository access</b> → <b>Only select repositories</b> → <b>m-ashraful.github.io</b> বাছুন।</li>' +
      '<li><b>Permissions</b> → <b>Repository permissions</b> → <b>Contents</b> → <b>Read and write</b>।</li>' +
      '<li>নিচে <b>Generate token</b> চাপুন, তারপর <b>github_pat_…</b> দিয়ে শুরু হওয়া চাবিটা কপি করে এখানে বসান।</li>'));
    var i = inp('', false, function () {}, 'github_pat_…'); i.autocomplete = 'off'; i.spellcheck = false;
    var b = el('button', 'btn pri', st.set ? 'নতুন চাবি বসান' : 'চাবি বসান'); b.type = 'button'; b.style.margin = '10px 0 16px';
    b.onclick = function () {
      busy('চাবি পরীক্ষা হচ্ছে…');
      callServer('apiSetToken', [i.value]).then(function () { busy(); toast('✅ চাবি কাজ করছে, বসানো হয়েছে'); if (!S.c) load(); else renderPanel(); }, function (e) { busy(); toast(e.message, true); });
    };
    box.appendChild(i); box.appendChild(b);
    if (st.set) {
      var c = el('button', 'btn sm danger', 'চাবি মুছে ফেলুন'); c.type = 'button'; c.style.margin = '0 0 16px 10px';
      c.onclick = function () { confirmBox('চাবি মুছবেন?', 'এরপর প্রকাশ করা যাবে না, যতক্ষণ না নতুন চাবি বসান।', 'মুছুন').then(function (ok) { if (ok) callServer('apiClearToken', []).then(function () { renderPanel(); }); }); };
      box.appendChild(c);
    }
  }, function (e) { box.innerHTML = '<div class="note warn">' + esc(e.message) + '</div>'; });
}

/* ---------- মেনু (থিম, লক, লগআউট) ---------- */
$('menuBtn').onclick = function () {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  modal('আরও', '<p>' + esc(S.me || '') + '</p>', [
    { t: dark ? '☀️ আলো থিম' : '🌙 অন্ধকার থিম', v: 'theme' }, { t: '🌐 সাইট খুলুন', v: 'site' }, { t: '🔒 লক করুন', v: 'lock' }, { t: '🚪 লগআউট', v: 'out', danger: true }
  ]).then(function (v) {
    if (v === 'theme') { var t = dark ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('pfa_theme', t); } catch (e) {} }
    if (v === 'site') window.open(SITE, '_blank', 'noopener');
    if (v === 'lock') appLockNow();
    if (v === 'out') {
      var go3 = function () { callServer('apiLogout', []).catch(function () {}).then(function () { setAuth(''); showLogin(); }); };
      if (isDirty()) confirmBox('না-প্রকাশিত বদল আছে', 'বদলগুলো এই ডিভাইসে খসড়া হিসেবে থাকবে, পরে লগইন করলে ফিরিয়ে আনা যাবে।', 'লগআউট').then(function (ok) { if (ok) { saveDraft(); go3(); } });
      else go3();
    }
  });
};

/* ---------- লগইন ---------- */
var LG = { email: '' };
function showLogin() {
  $('app').hidden = true; $('login').hidden = false;
  lgStep(1);
  if (window.appLockWaitLogin) appLockWaitLogin();
}
function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  if (!S.c) { S.sec = (location.hash || '').slice(1) || 'hero'; navHtml(); load(); }
}
function lgStep(n) {
  $('lgStep1').hidden = n !== 1; $('lgStep2').hidden = n !== 2; $('lgBack').hidden = n !== 2;
  $('lgBtn').textContent = n === 1 ? 'কোড পাঠান' : 'লগইন';
  lgMsg(n === 2 ? LG.email + ' — ইনবক্সে কোড গেছে (Spam-ও দেখুন)।' : '', true);
  setTimeout(function () { (n === 1 ? $('lgEmail') : $('lgCode')).focus(); }, 30);
}
function lgMsg(m, ok) { var e = $('lgMsg'); e.textContent = m; e.className = 'lg-msg' + (ok ? ' ok' : ''); }
function device() {
  var u = navigator.userAgent;
  var os = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'অন্য';
  var br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Browser';
  return os + ' · ' + br;
}
$('lgForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('lgBtn'); if (btn.disabled) return;
  var step1 = !$('lgStep1').hidden;
  var done = function () { btn.disabled = false; btn.textContent = step1 ? 'কোড পাঠান' : 'লগইন'; };
  if (step1) {
    var em = $('lgEmail').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { lgMsg('ঠিক ইমেইল লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ পাঠানো হচ্ছে…'; lgMsg('');
    callServer('apiSendCode', [em]).then(function () { LG.email = em; done(); lgStep(2); }, function (err) { done(); lgMsg(err.message); });
  } else {
    var code = $('lgCode').value.replace(/\D/g, '');
    if (code.length !== 6) { lgMsg('৬ সংখ্যার কোড লিখুন।'); return; }
    btn.disabled = true; btn.textContent = '⏳ যাচাই হচ্ছে…'; lgMsg('');
    callServer('apiVerifyCode', [LG.email, code, device()]).then(function (tok) {
      done(); setAuth(tok); $('lgCode').value = '';
      if (window.appLockAfterLogin) appLockAfterLogin();
    }, function (err) { done(); lgMsg(err.message); });
  }
});
$('lgBack').addEventListener('click', function () { lgStep(1); });

window.onUnlocked = function () { showApp(); };
if (!AUTH) showLogin();
else if (document.documentElement.hasAttribute('data-al-open')) showApp();   // PIN আগেই খোলা (১৫ মিনিটের মধ্যে ফিরেছেন)
</script>
</body>
</html>
